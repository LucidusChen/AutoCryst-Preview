[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocryst-local-bridge"
version = "0.0.0"
description = "Local versioned Python helper for a future native frontend"
requires-python = ">=3.10"
dependencies = ["crystalx-core>=0.6.1,<0.7", "crystalx-web>=0.1.1,<0.2"]

[project.scripts]
autocryst-helper = "crystalx_bridge.helper:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
